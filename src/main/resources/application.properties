# Server Configuration
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=clinic-appointment-system

# MySQL Database Configuration
# Automatically creates the database 'clinic_db' if it does not already exist
# Supports Aiven/Render/Railway cloud environment variables while defaulting to local MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:${MYSQLHOST:localhost}}:${MYSQL_PORT:${MYSQLPORT:3306}}/${MYSQL_DATABASE:${MYSQLDATABASE:clinic_db}}?createDatabaseIfNotExist=true&useSSL=${MYSQL_USE_SSL:false}&sslMode=${MYSQL_SSL_MODE:DISABLED}&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:${MYSQLUSER:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:${MYSQLPASSWORD:}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# Automatically creates or updates table schema based on Java @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson Date Formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Kolkata

# Email Delivery Configuration
# Provider selection: auto (detects brevo if API key set, else smtp), brevo, or smtp
email.provider=${EMAIL_PROVIDER:auto}

# Brevo HTTPS REST API Configuration (Free tier for Render deployment - bypasses outbound SMTP block)
brevo.api-key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:${MAIL_USERNAME:}}
brevo.sender.name=${BREVO_SENDER_NAME:Clinic Care Team}
brevo.api-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}

# Spring Mail SMTP Configuration (Gmail SMTP with App Password for local development)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:${SPRING_MAIL_USERNAME:}}
spring.mail.password=${MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Development Static Resource Cache-Control (prevents browser serving stale cached pages)
spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

# SMS Gateway Configuration (India Delivery Support)
# Supported providers: twilio, fast2sms
sms.provider=${SMS_PROVIDER:twilio}

# Twilio SMS Configuration (International / India +91 delivery)
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}

# Fast2SMS Configuration (India Domestic SMS Gateway)
fast2sms.api-key=${FAST2SMS_API_KEY:}
fast2sms.route=${FAST2SMS_ROUTE:otp}

