<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Specializations - Clinic Appointment Booking System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav class="navbar">
        <a href="/pages/index.html" class="brand">
            <div class="brand-icon">🏥</div>
            Clinic Appointment Booking System
        </a>
        <ul class="nav-links" id="navLinks"></ul>
    </nav>

    <div class="container" style="max-width: 900px;">
        <div class="card" style="margin-bottom: 2rem;">
            <div class="card-header">
                <h3 class="card-title">➕ Add New Medical Specialization</h3>
            </div>
            <form onsubmit="handleCreateSpecialization(event)">
                <div class="form-row">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">Specialization Name *</label>
                        <input type="text" id="newSpecName" class="form-control" placeholder="e.g. Neurology, Oncology" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">Description</label>
                        <input type="text" id="newSpecDesc" class="form-control" placeholder="Short description of department">
                    </div>
                </div>
                <div style="margin-top: 1rem; text-align: right;">
                    <button type="submit" class="btn btn-primary">Add Specialization</button>
                </div>
            </form>
        </div>

        <div class="card">
            <div class="card-header">
                <h3 class="card-title">🏷️ Active Specializations</h3>
            </div>
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th style="width: 60px;">#</th>
                            <th>Department / Specialization</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody id="specTableBody">
                        <!-- Populated via admin.js -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Clinic Appointment Booking System</p>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (checkAuthGuard(['ADMIN'])) {
                loadAdminSpecializations();
            }
        });
    </script>
</body>
</html>
